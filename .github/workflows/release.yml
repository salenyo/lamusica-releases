name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "lamusica-app tag or branch to build"
        required: true
        default: main

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout app source (private)
        uses: actions/checkout@v4
        with:
          repository: salenyo/lamusica-app
          ref: ${{ github.event.inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_KEY }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "lamusica v__VERSION__"
          releaseBody: "Beta build. Приложение обновится само при следующем запуске."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Linux tarball (Arch and other distros)
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          STAGE="lamusica-app_${VERSION}_x86_64-linux"
          mkdir -p "$STAGE"
          cp src-tauri/target/release/lamusica-app "$STAGE/"
          cp src-tauri/icons/128x128@2x.png "$STAGE/lamusica-app.png"
          cat > "$STAGE/lamusica-app.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=lamusica
          Comment=Music from every source in one player
          Exec=lamusica-app
          Icon=lamusica-app
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          EOF
          cat > "$STAGE/install.sh" <<'EOF'
          #!/usr/bin/env sh
          set -e
          PREFIX="${PREFIX:-/usr/local}"
          install -Dm755 lamusica-app "$PREFIX/bin/lamusica-app"
          install -Dm644 lamusica-app.desktop "$PREFIX/share/applications/lamusica-app.desktop"
          install -Dm644 lamusica-app.png "$PREFIX/share/icons/hicolor/256x256/apps/lamusica-app.png"
          echo "lamusica installed to $PREFIX"
          EOF
          cat > "$STAGE/README.txt" <<'EOF'
          lamusica for Arch Linux and other distributions.

          Run directly:      ./lamusica-app
          Install system-wide: sudo ./install.sh

          Dependencies (Arch): pacman -S webkit2gtk-4.1 alsa-lib
          Note: builds installed from this archive do not auto-update.
          Grab a newer archive from the releases page when one appears.
          EOF
          chmod +x "$STAGE/install.sh"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          gh release upload "v$VERSION" "$STAGE.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
